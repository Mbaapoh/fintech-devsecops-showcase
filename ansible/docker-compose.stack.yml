services:
  traefik:
    image: traefik:v3.6.5
    container_name: traefik
    restart: always
    environment:
      - DOCKER_API_VERSION=1.47
    command:
      - "--log.level=DEBUG"
      - "--api.insecure=false"
      - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.myresolver.acme.httpchallenge=true"
      - "--certificatesresolvers.myresolver.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.myresolver.acme.email=zonelvis@okay.cm"
      - "--certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json"
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/acme.json:/letsencrypt/acme.json
    networks:
      - fintech-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik_dash.rule=Host(`traefik.demo.okay.cm`)"
      - "traefik.http.routers.traefik_dash.service=api@internal"
      - "traefik.http.routers.traefik_dash.entrypoints=websecure"
      - "traefik.http.routers.traefik_dash.tls.certresolver=myresolver"
      - "traefik.http.routers.traefik_dash.middlewares=auth"
      - "traefik.http.middlewares.auth.basicauth.users=${TRAEFIK_BASIC_AUTH}"

  sonarqube:
    image: sonarqube:community
    container_name: sonarqube
    restart: always
    # Expose only via Traefik
    expose:
      - "9000"
    environment:
      - SONAR_JDBC_URL=jdbc:postgresql://db:5432/sonar
      - SONAR_JDBC_USERNAME=sonar
      - SONAR_JDBC_PASSWORD=${SONAR_DB_PASSWORD}
    volumes:
      - sonar_data:/opt/sonarqube/data
      - sonar_extensions:/opt/sonarqube/extensions
      - sonar_logs:/opt/sonarqube/logs
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    depends_on:
      - db
    networks:
      - fintech-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sonarqube.rule=Host(`sonarqube.demo.okay.cm`)"
      - "traefik.http.routers.sonarqube.entrypoints=websecure"
      - "traefik.http.routers.sonarqube.tls.certresolver=myresolver"
      - "traefik.http.services.sonarqube.loadbalancer.server.port=9000"

  db:
    image: postgres:13
    container_name: sonar_db
    restart: always
    environment:
      - POSTGRES_USER=sonar
      - POSTGRES_PASSWORD=${SONAR_DB_PASSWORD}
    volumes:
      - postgresql:/var/lib/postgresql/data
    networks:
      - fintech-net

  jenkins:
    build:
      context: .
      dockerfile: Jenkins.Dockerfile
    container_name: jenkins
    restart: always
    expose:
      - "8080"
    ports:
      - "50000:50000"
    user: root
    environment:
      - JENKINS_ADMIN_PASSWORD=${JENKINS_ADMIN_PASSWORD}
      - MICROCKS_SERVICE_ACCOUNT_SECRET=${MICROCKS_SERVICE_ACCOUNT_SECRET}
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=false -Djava.awt.headless=true
      - CASC_JENKINS_CONFIG=/var/jenkins_home/casc_configs/jenkins.yaml
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - /usr/bin/docker:/usr/bin/docker
      - ./jenkins-config/jenkins.yaml:/var/jenkins_home/casc_configs/jenkins.yaml:ro
    networks:
      - fintech-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.jenkins.rule=Host(`jenkins.demo.okay.cm`)"
      - "traefik.http.routers.jenkins.entrypoints=websecure"
      - "traefik.http.routers.jenkins.tls.certresolver=myresolver"
      - "traefik.http.services.jenkins.loadbalancer.server.port=8080"

  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: always
    environment:
      - N8N_HOST=n8n.demo.okay.cm
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - NODE_ENV=production
      - WEBHOOK_URL=https://n8n.demo.okay.cm/
      - GENERIC_TIMEZONE=Europe/Berlin
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - fintech-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.n8n.rule=Host(`n8n.demo.okay.cm`)"
      - "traefik.http.routers.n8n.entrypoints=websecure"
      - "traefik.http.routers.n8n.tls.certresolver=myresolver"
      - "traefik.http.routers.n8n.tls.certresolver=myresolver"
      - "traefik.http.services.n8n.loadbalancer.server.port=5678"

  infisical-db:
    image: postgres:16-alpine
    container_name: infisical_db
    restart: always
    environment:
      - POSTGRES_USER=infisical
      - POSTGRES_PASSWORD=${INFISICAL_DB_PASSWORD}
      - POSTGRES_DB=infisical
    volumes:
      - infisical_db_data:/var/lib/postgresql/data
    networks:
      - fintech-net

  infisical-redis:
    image: redis:7-alpine
    container_name: infisical_redis
    restart: always
    networks:
      - fintech-net

  infisical:
    image: infisical/infisical:latest
    container_name: infisical
    restart: always
    depends_on:
      - infisical-db
      - infisical-redis
    environment:
      - NODE_ENV=production
      - ENCRYPTION_KEY=${INFISICAL_ENCRYPTION_KEY}
      - AUTH_SECRET=${INFISICAL_AUTH_SECRET}
      - DB_CONNECTION_URI=postgresql://infisical:${INFISICAL_DB_PASSWORD}@infisical-db:5432/infisical
      - REDIS_URL=redis://infisical-redis:6379
      - SITE_URL=https://infisical.demo.okay.cm
    networks:
      - fintech-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.infisical.rule=Host(`infisical.demo.okay.cm`)"
      - "traefik.http.routers.infisical.entrypoints=websecure"
      - "traefik.http.routers.infisical.tls.certresolver=myresolver"
      - "traefik.http.services.infisical.loadbalancer.server.port=8080"

  portainer:
    image: portainer/portainer-ce:2.21.3
    container_name: portainer
    restart: always
    command: -H unix:///var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - fintech-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.portainer.rule=Host(`portainer.demo.okay.cm`)"
      - "traefik.http.routers.portainer.entrypoints=websecure"
      - "traefik.http.routers.portainer.tls.certresolver=myresolver"
      - "traefik.http.services.portainer.loadbalancer.server.port=9000"

  wordpress-db:
    image: mariadb:11.4
    container_name: wordpress_db
    restart: always
    environment:
      - MYSQL_DATABASE=wordpress
      - MYSQL_USER=wordpress
      - MYSQL_PASSWORD=${WP_DB_PASSWORD}
      - MYSQL_RANDOM_ROOT_PASSWORD=1
    volumes:
      - wp_db_data:/var/lib/mysql
    networks:
      - fintech-net

  wordpress:
    image: wordpress:6-apache
    container_name: wordpress
    restart: always
    depends_on:
      - wordpress-db
    environment:
      - WORDPRESS_DB_HOST=wordpress-db
      - WORDPRESS_DB_USER=wordpress
      - WORDPRESS_DB_PASSWORD=${WP_DB_PASSWORD}
      - WORDPRESS_DB_NAME=wordpress
    volumes:
      - wp_data:/var/www/html
    networks:
      - fintech-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.wordpress.rule=Host(`wordpress.demo.okay.cm`)"
      - "traefik.http.routers.wordpress.entrypoints=websecure"
      - "traefik.http.routers.wordpress.tls.certresolver=myresolver"
      - "traefik.http.services.wordpress.loadbalancer.server.port=80"

  mongodb:
    image: mongo:7.0
    container_name: microcks-db
    restart: unless-stopped
    volumes:
      - microcks-mongo-data:/data/db
    networks:
      - fintech-net

  microcks:
    image: quay.io/microcks/microcks-uber:latest
    container_name: microcks
    restart: unless-stopped
    depends_on:
      - mongodb
    environment:
      - SPRING_PROFILES_ACTIVE=uber,prod
      - MONGO_HOST=mongodb
    volumes:
      - microcks-data:/data
      - ../microcks-config/application.properties:/deployments/config/application.properties:ro
    networks:
      - fintech-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.microcks.rule=Host(`microcks.demo.okay.cm`)"
      - "traefik.http.routers.microcks.entrypoints=websecure"
      - "traefik.http.routers.microcks.tls.certresolver=myresolver"
      - "traefik.http.services.microcks.loadbalancer.server.port=8080"
  keycloak-db:
    image: postgres:15
    container_name: keycloak-postgres
    restart: always
    environment:
      - POSTGRES_DB=keycloak
      - POSTGRES_USER=keycloak
      - POSTGRES_PASSWORD=${KEYCLOAK_DB_PASSWORD}
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    networks:
      - fintech-net

  keycloak:
    image: quay.io/keycloak/keycloak:26.5.0
    container_name: keycloak
    restart: always
    command: start-dev
    environment:
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://keycloak-db:5432/keycloak
      - KC_DB_USERNAME=keycloak
      - KC_DB_PASSWORD=${KEYCLOAK_DB_PASSWORD}
      - KC_HOSTNAME=keycloak.demo.okay.cm
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
    depends_on:
      - keycloak-db
    networks:
      - fintech-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.keycloak.rule=Host(`keycloak.demo.okay.cm`)"
      - "traefik.http.routers.keycloak.entrypoints=websecure"
      - "traefik.http.routers.keycloak.tls.certresolver=myresolver"
      - "traefik.http.services.keycloak.loadbalancer.server.port=8080"

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.6.0
    container_name: oauth2-proxy
    restart: always
    environment:
      - OAUTH2_PROXY_HTTP_ADDRESS=0.0.0.0:4180
      - OAUTH2_PROXY_UPSTREAMS=http://jenkins:8080
      - OAUTH2_PROXY_COOKIE_SECRET=${OAUTH2_PROXY_COOKIE_SECRET}
      - OAUTH2_PROXY_CLIENT_ID=jenkins
      - OAUTH2_PROXY_CLIENT_SECRET=${OAUTH2_PROXY_CLIENT_SECRET}
      - OAUTH2_PROXY_PROVIDER=keycloak-oidc
      - OAUTH2_PROXY_OIDC_ISSUER_URL=https://keycloak.demo.okay.cm/realms/master
    networks:
      - fintech-net

  pma-db:
    image: mariadb:11.2
    container_name: pma-mariadb
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=${PMA_DB_ROOT_PASSWORD}
    volumes:
      - pma_db_data:/var/lib/mysql
    networks:
      - fintech-net

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: phpmyadmin
    restart: always
    depends_on:
      - pma-db
    environment:
      - PMA_HOST=pma-db
    networks:
      - fintech-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.phpmyadmin.rule=Host(`phpmyadmin.demo.okay.cm`)"
      - "traefik.http.routers.phpmyadmin.entrypoints=websecure"
      - "traefik.http.routers.phpmyadmin.tls.certresolver=myresolver"
      - "traefik.http.services.phpmyadmin.loadbalancer.server.port=80"

volumes:
  pma_db_data:
  keycloak_db_data:
  sonar_data:
  sonar_extensions:
  sonar_logs:
  postgresql:
  jenkins_home:
  odc-data:
  n8n_data:
  infisical_db_data:
  portainer_data:
  wp_data:
  wp_db_data:
  microcks-mongo-data:
  microcks-data:

networks:
  fintech-net:
    name: fintech-net
    driver: bridge
