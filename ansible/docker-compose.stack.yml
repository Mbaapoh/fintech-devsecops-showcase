services:
  sonarqube:
    image: sonarqube:community
    container_name: sonarqube
    ports:
      - "9000:9000"
    environment:
      - SONAR_JDBC_URL=jdbc:postgresql://db:5432/sonar
      - SONAR_JDBC_USERNAME=sonar
      - SONAR_JDBC_PASSWORD=sonar
    volumes:
      - sonar_data:/opt/sonarqube/data
      - sonar_extensions:/opt/sonarqube/extensions
      - sonar_logs:/opt/sonarqube/logs
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    depends_on:
      - db
    networks:
      - fintech-net

  db:
    image: postgres:13
    container_name: sonar_db
    environment:
      - POSTGRES_USER=sonar
      - POSTGRES_PASSWORD=sonar
    volumes:
      - postgresql:/var/lib/postgresql/data
    networks:
      - fintech-net

  jenkins:
    build:
      context: .
      dockerfile: Jenkins.Dockerfile
    container_name: jenkins
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      # Mount docker socket and binary to allow Docker-in-Docker
      - /var/run/docker.sock:/var/run/docker.sock
      - /usr/bin/docker:/usr/bin/docker
    user: root # For demo purposes to access docker sock easily
    environment:
      - JAVA_OPTS=-Djenkins.security.csrf.DefaultCrumbIssuer.EXCLUDE_SESSION_ID=true
    networks:
      - fintech-net

volumes:
  sonar_data:
  sonar_extensions:
  sonar_logs:
  postgresql:
  jenkins_home:

networks:
  fintech-net:
    name: fintech-net
    driver: bridge
