services:
  traefik:
    image: traefik:v3.6.5
    container_name: traefik
    restart: always
    environment:
      - DOCKER_API_VERSION=1.47
    command:
      - "--api.insecure=false"
      - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.myresolver.acme.httpchallenge=true"
      - "--certificatesresolvers.myresolver.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.myresolver.acme.email=admin@okay.cm"
      - "--certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json"
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/acme.json:/letsencrypt/acme.json
    networks:
      - fintech-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik_dash.rule=Host(`traefik.demo.okay.cm`)"
      - "traefik.http.routers.traefik_dash.service=api@internal"
      - "traefik.http.routers.traefik_dash.entrypoints=websecure"
      - "traefik.http.routers.traefik_dash.tls.certresolver=myresolver"
      - "traefik.http.routers.traefik_dash.middlewares=auth"
      - "traefik.http.middlewares.auth.basicauth.users=admin:$$apr1$$88C94x3N$$Y1xY7qE2T6vJ5P5zO6zP6."

  sonarqube:
    image: sonarqube:community
    container_name: sonarqube
    restart: always
    # Expose only via Traefik
    expose:
      - "9000"
    environment:
      - SONAR_JDBC_URL=jdbc:postgresql://db:5432/sonar
      - SONAR_JDBC_USERNAME=sonar
      - SONAR_JDBC_PASSWORD=sonar
    volumes:
      - sonar_data:/opt/sonarqube/data
      - sonar_extensions:/opt/sonarqube/extensions
      - sonar_logs:/opt/sonarqube/logs
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    depends_on:
      - db
    networks:
      - fintech-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sonarqube.rule=Host(`sonarqube.demo.okay.cm`)"
      - "traefik.http.routers.sonarqube.entrypoints=websecure"
      - "traefik.http.routers.sonarqube.tls.certresolver=myresolver"
      - "traefik.http.services.sonarqube.loadbalancer.server.port=9000"

  db:
    image: postgres:13
    container_name: sonar_db
    restart: always
    environment:
      - POSTGRES_USER=sonar
      - POSTGRES_PASSWORD=sonar
    volumes:
      - postgresql:/var/lib/postgresql/data
    networks:
      - fintech-net

  jenkins:
    build:
      context: .
      dockerfile: Jenkins.Dockerfile
    container_name: jenkins
    restart: always
    expose:
      - "8080"
    ports:
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - /usr/bin/docker:/usr/bin/docker
    user: root
    environment:
      - JAVA_OPTS=-Djenkins.security.csrf.DefaultCrumbIssuer.EXCLUDE_SESSION_ID=true
    networks:
      - fintech-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.jenkins.rule=Host(`jenkins.demo.okay.cm`)"
      - "traefik.http.routers.jenkins.entrypoints=websecure"
      - "traefik.http.routers.jenkins.tls.certresolver=myresolver"
      - "traefik.http.services.jenkins.loadbalancer.server.port=8080"

volumes:
  sonar_data:
  sonar_extensions:
  sonar_logs:
  postgresql:
  jenkins_home:
  odc-data:

networks:
  fintech-net:
    name: fintech-net
    driver: bridge
